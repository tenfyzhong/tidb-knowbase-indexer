name: Sync Knowledge Base

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_clean:
        description: 'Clean run indicator'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript
        run: pnpm build

      - name: Run Knowledge Base Sync
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}
          TIDB_DATABASE_URL: ${{ secrets.TIDB_DATABASE_URL }}
          TIDB_HOST: ${{ secrets.TIDB_HOST }}
          TIDB_PORT: ${{ secrets.TIDB_PORT }}
          TIDB_USER: ${{ secrets.TIDB_USER }}
          TIDB_PASSWORD: ${{ secrets.TIDB_PASSWORD }}
          TIDB_DATABASE: ${{ secrets.TIDB_DATABASE }}
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          EMBEDDING_PROVIDER: ${{ secrets.EMBEDDING_PROVIDER || vars.EMBEDDING_PROVIDER }}
          EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY || secrets.OPENAI_API_KEY }}
          EMBEDDING_BASE_URL: ${{ secrets.EMBEDDING_BASE_URL || vars.EMBEDDING_BASE_URL }}
          EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL || vars.EMBEDDING_MODEL }}
          EMBEDDING_DIMENSION: ${{ secrets.EMBEDDING_DIMENSION || vars.EMBEDDING_DIMENSION }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: node dist/index.js
